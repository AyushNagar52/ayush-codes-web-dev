 <!-- CSS USING -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <h1><font color="red" size="10">Hello Ayush Bhaiya</font></h1>
    <ul>
        <li><font color="green" size="10">Milk</font></li>
        <li><font color="orange" size="10">Whey</font></li>
        <li><font color="blue" size="10">Fruits</font></li>
        <li><font color="black" size="10">Juice</font></li>
        
    </ul>
 </body>
 </html>
